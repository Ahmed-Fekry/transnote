<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --glass: rgba(255,255,255,0.08);
    --glass2: rgba(255,255,255,0.13);
    --border: rgba(255,255,255,0.15);
    --text: rgba(255,255,255,0.92);
    --muted: rgba(255,255,255,0.4);
    --accent: #a8edca;
    --danger: rgba(255,100,100,0.7);
  }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-app-region: no-drag;
  }

  .app {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    background: rgba(12, 14, 18, 0.45);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border);
    box-shadow: 0 24px 64px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
    overflow: hidden;
    transition: background 0.2s;
  }

  /* ── TITLEBAR ── */
  .titlebar {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    gap: 8px;
    -webkit-app-region: drag;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.04);
  }

  .controls {
    display: flex;
    gap: 6px;
    -webkit-app-region: no-drag;
  }

  .ctrl-btn {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px;
    color: transparent;
  }
  .ctrl-btn:hover { color: rgba(0,0,0,0.6); }
  .ctrl-btn.close { background: #ff5f57; }
  .ctrl-btn.close:hover { background: #ff3b30; }
  .ctrl-btn.min { background: #ffbd2e; }
  .ctrl-btn.min:hover { background: #f5a623; }

  .title {
    font-family: 'Instrument Serif', serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.3px;
    flex: 1;
    text-align: center;
    -webkit-app-region: drag;
  }

  .toolbar {
    display: flex;
    gap: 4px;
    -webkit-app-region: no-drag;
  }

  .tb-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 5px;
    border-radius: 5px;
    transition: all 0.15s;
    line-height: 1;
  }
  .tb-btn:hover { background: var(--glass2); color: var(--text); }
  .tb-btn.active { color: var(--accent); }

  /* ── OPACITY SLIDER ── */
  .opacity-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }

  .opacity-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
    min-width: 24px;
  }

  #opacitySlider {
    flex: 1;
    -webkit-appearance: none;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--pct,70%), rgba(255,255,255,0.15) var(--pct,70%));
    outline: none;
    cursor: pointer;
  }
  #opacitySlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 6px rgba(168,237,202,0.6);
    cursor: pointer;
    transition: transform 0.15s;
  }
  #opacitySlider::-webkit-slider-thumb:hover { transform: scale(1.3); }

  #opacityVal {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--accent);
    min-width: 28px;
    text-align: right;
  }

  /* ── TEXTAREA ── */
  .note-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  #note {
    width: 100%; height: 100%;
    background: transparent;
    border: none;
    outline: none;
    padding: 16px 18px;
    font-family: 'Instrument Serif', serif;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
    resize: none;
    caret-color: var(--accent);
    overflow-y: auto;
    -webkit-app-region: no-drag;
  }

  #note::placeholder {
    color: rgba(255,255,255,0.2);
    font-style: italic;
  }

  #note::-webkit-scrollbar { width: 3px; }
  #note::-webkit-scrollbar-track { background: transparent; }
  #note::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  /* ── FOOTER ── */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    border-top: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }

  .wordcount {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  .saved-indicator {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.3s;
  }
  .saved-indicator.saving { color: var(--accent); }

  .saved-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .saved-indicator.saving .saved-dot { background: var(--accent); box-shadow: 0 0 4px var(--accent); }

  /* Font mode toggle */
  body.mono #note { font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.7; }

  /* Color themes */
  body.warm .app { background: rgba(20,14,10,0.45); }
  body.warm { --accent: #f9c784; --border: rgba(255,220,150,0.15); }
  body.cool .app { background: rgba(8,14,24,0.45); }
  body.cool { --accent: #7eb8f7; --border: rgba(100,180,255,0.15); }
  body.rose .app { background: rgba(20,10,14,0.45); }
  body.rose { --accent: #f7a8c4; --border: rgba(255,150,180,0.15); }

  /* Pinned indicator */
  .tb-btn.pinned { color: var(--accent); }

  /* Resize handle */
  .resize-handle {
    position: absolute;
    bottom: 0; right: 0;
    width: 16px; height: 16px;
    cursor: se-resize;
    -webkit-app-region: no-drag;
    opacity: 0.3;
  }
  .resize-handle::after {
    content: '';
    position: absolute;
    bottom: 4px; right: 4px;
    width: 6px; height: 6px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- TITLEBAR -->
  <div class="titlebar">
    <div class="controls">
      <button class="ctrl-btn close" onclick="close_()">✕</button>
      <button class="ctrl-btn min" onclick="minimize()">−</button>
    </div>

    <div class="title" id="titleEl">note</div>

    <div class="toolbar">
      <button class="tb-btn" id="pinBtn" title="Always on top" onclick="togglePin()">📌</button>
      <button class="tb-btn" title="Toggle font" onclick="toggleFont()">Aa</button>
      <div style="position:relative">
        <button class="tb-btn" title="Theme" onclick="toggleThemeMenu()">🎨</button>
        <div id="themeMenu" style="display:none;position:absolute;right:0;top:24px;background:rgba(15,17,22,0.95);border:1px solid var(--border);border-radius:8px;padding:6px;z-index:99;display:none;flex-direction:column;gap:3px;min-width:90px">
          <div class="theme-opt" onclick="setTheme('')">🌿 Green</div>
          <div class="theme-opt" onclick="setTheme('warm')">🌅 Warm</div>
          <div class="theme-opt" onclick="setTheme('cool')">🌊 Cool</div>
          <div class="theme-opt" onclick="setTheme('rose')">🌸 Rose</div>
        </div>
      </div>
      <button class="tb-btn" title="Clear" onclick="clearNote()">🗑</button>
    </div>
  </div>

  <!-- OPACITY -->
  <div class="opacity-bar">
    <span class="opacity-label">opacity</span>
    <input type="range" id="opacitySlider" min="15" max="100" value="75" oninput="setOpacity(this.value)">
    <span id="opacityVal">75%</span>
  </div>

  <!-- NOTE AREA -->
  <div class="note-wrap">
    <textarea id="note" placeholder="Start writing anything…&#10;&#10;This note floats above all your windows.&#10;Adjust opacity to see through it."></textarea>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="wordcount" id="wc">0 words</span>
    <span class="saved-indicator" id="savedEl">
      <span class="saved-dot"></span>saved
    </span>
  </div>

</div>

<style>
.theme-opt{padding:5px 10px;font-size:11px;color:rgba(255,255,255,0.7);cursor:pointer;border-radius:4px;font-family:'DM Mono',monospace}
.theme-opt:hover{background:rgba(255,255,255,0.08);color:#fff}
</style>

<script>
const { ipcRenderer } = require('electron');

let pinned = true;
let themeMenuOpen = false;
let saveTimer = null;

// ── OPACITY ──
function setOpacity(val) {
  const pct = val / 100;
  document.getElementById('opacityVal').textContent = val + '%';
  document.getElementById('opacitySlider').style.setProperty('--pct', val + '%');
  ipcRenderer.send('set-opacity', pct);
}

// Init
setOpacity(75);

// ── WINDOW CONTROLS ──
function close_() { ipcRenderer.send('close'); }
function minimize() { ipcRenderer.send('minimize'); }

function togglePin() {
  pinned = !pinned;
  ipcRenderer.send('toggle-top', pinned);
  const btn = document.getElementById('pinBtn');
  btn.className = 'tb-btn' + (pinned ? ' pinned' : '');
  btn.title = pinned ? 'Pinned on top' : 'Not pinned';
}

// ── FONT TOGGLE ──
function toggleFont() {
  document.body.classList.toggle('mono');
}

// ── THEME ──
function toggleThemeMenu() {
  const m = document.getElementById('themeMenu');
  themeMenuOpen = !themeMenuOpen;
  m.style.display = themeMenuOpen ? 'flex' : 'none';
}

function setTheme(t) {
  document.body.className = document.body.className
    .split(' ').filter(c => !['warm','cool','rose','mono'].includes(c) || c === 'mono').join(' ');
  if (t) document.body.classList.add(t);
  document.getElementById('themeMenu').style.display = 'none';
  themeMenuOpen = false;
  localStorage.setItem('theme', t);
}

document.addEventListener('click', (e) => {
  if (themeMenuOpen && !e.target.closest('.tb-btn')) {
    document.getElementById('themeMenu').style.display = 'none';
    themeMenuOpen = false;
  }
});

// ── NOTE SAVING ──
const note = document.getElementById('note');

// Load saved content
const saved = localStorage.getItem('note-content');
if (saved) note.value = saved;
updateWC();

note.addEventListener('input', () => {
  updateWC();
  showSaving();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem('note-content', note.value);
    showSaved();
  }, 800);
});

function updateWC() {
  const words = note.value.trim() ? note.value.trim().split(/\s+/).length : 0;
  const chars = note.value.length;
  document.getElementById('wc').textContent = `${words} words · ${chars} chars`;
}

function showSaving() {
  const el = document.getElementById('savedEl');
  el.className = 'saved-indicator saving';
  el.querySelector('.saved-dot').style.background = 'var(--accent)';
  el.childNodes[1].textContent = 'saving…';
}

function showSaved() {
  const el = document.getElementById('savedEl');
  el.className = 'saved-indicator';
  el.childNodes[1].textContent = 'saved';
}

function clearNote() {
  if (!note.value || confirm('Clear the note?')) {
    note.value = '';
    localStorage.removeItem('note-content');
    updateWC();
    showSaved();
  }
}

// Restore theme
const savedTheme = localStorage.getItem('theme') || '';
if (savedTheme) document.body.classList.add(savedTheme);

// Restore opacity
const savedOpacity = localStorage.getItem('opacity') || '75';
document.getElementById('opacitySlider').value = savedOpacity;
setOpacity(savedOpacity);

document.getElementById('opacitySlider').addEventListener('change', (e) => {
  localStorage.setItem('opacity', e.target.value);
});

// Focus note on start
note.focus();
</script>
</body>
</html>
